stages:
  - release

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_DEPTH: 0

.publish-rules: &publish-rules
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "stable")'

calculate_version:
  stage: release
  image: node:20
  <<: *publish-rules
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends jq git
  script:
    - export BRANCH="$CI_COMMIT_BRANCH"
    - export BASE_VERSION=$(jq -r '.version' frontend/package.json)
    - echo "Branch $BRANCH"
    - echo "Base version $BASE_VERSION"
    - |
      if [ "$BRANCH" = "stable" ]; then
        VERSION="$BASE_VERSION"
      else
        TAG_BRANCH="$BRANCH"
        case "$TAG_BRANCH" in
          v[0-9]*) TAG_BRANCH="develop" ;;
        esac
        git fetch --tags >/dev/null
        NUMBER=0
        while git tag -l | grep -qx "${BASE_VERSION}-${TAG_BRANCH}.${NUMBER}"; do
          NUMBER=$((NUMBER + 1))
        done
        VERSION="${BASE_VERSION}-${TAG_BRANCH}.${NUMBER}"
      fi
    - |
      if [ "$BRANCH" = "stable" ]; then
        PRERELEASE=false
      else
        PRERELEASE=true
      fi
    - echo "Version $VERSION"
    - echo "VERSION=$VERSION"       >  release.env
    - echo "BRANCH=$BRANCH"         >> release.env
    - echo "PRERELEASE=$PRERELEASE" >> release.env
  artifacts:
    reports:
      dotenv: release.env

create_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  <<: *publish-rules
  needs:
    - job: calculate_version
      artifacts: true
  script:
    - echo "Creating release $VERSION (prerelease=$PRERELEASE) from $CI_COMMIT_SHA"
  release:
    tag_name: "$VERSION"
    name: "$VERSION"
    description: "Release $VERSION (prerelease=$PRERELEASE)"
    ref: "$CI_COMMIT_SHA"
