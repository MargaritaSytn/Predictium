server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API calls go straight to the backend service (baked in via
    # VITE_API_BASE_URL at build time), so nginx only serves the static SPA.

    # Serve React SPA — fall back to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
